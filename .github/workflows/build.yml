name: build

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Network tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/net_test.cpp src/net/protocol.cpp src/net/joincode.cpp -o net_test
          ./net_test
      - name: Name-tag projection test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/camera_test.cpp -o camera_test
          ./camera_test
      - name: Dedicated server tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/server_test.cpp src/server/relay.cpp src/server/discord.cpp src/net/protocol.cpp -ldl -pthread -o server_test
          ./server_test
      - name: Host send-limit tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/host_guard_test.cpp -o host_guard_test
          ./host_guard_test
      - name: Dedicated server build (Linux)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target mecmp_server
      - name: Upload the Linux server
        uses: actions/upload-artifact@v4
        with:
          name: mecmp_server-linux-x64
          path: build-linux/mecmp_server
      - name: Ghost placement test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/pose_test.cpp -o pose_test
          ./pose_test

  windows-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64 and CMake
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 cmake ninja-build
      - name: Configure and build (x64, Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_BUILD_TYPE=Release \
            -DMECMP_DEBUG_KEYS=OFF
          cmake --build build 2>&1 | tee build.log || true; grep -E "error|Error" build.log | head -15 | while read -r l; do echo "::error::$l"; done; test -f build/mecmp.dll
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: mecmp-x64
          path: |
            build/*.dll
            build/*.exe
