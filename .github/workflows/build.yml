name: build

on:
  push:
  pull_request:

jobs:
  windows-session-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Locate MSVC
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC x64 tools were not found" }
          $devCmd = Join-Path $installation "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path -LiteralPath $devCmd)) { throw "VsDevCmd.bat was not found" }
          "MSVC_DEV_CMD=$devCmd" >> $env:GITHUB_ENV
      - name: Host setup status and session switching
        shell: cmd
        run: |
          call "%MSVC_DEV_CMD%" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DNOMINMAX /DMECMP_DEBUG_KEYS=0 /DMECMP_VERBOSE_DEFAULT=0 /Isrc tests/hosting_status_test.cpp src/core/config.cpp src/core/log.cpp src/net/upnp.cpp src/net/joincode.cpp src/net/protocol.cpp /Fe:hosting_status_test.exe /link ws2_32.lib
          if errorlevel 1 exit /b 1
          hosting_status_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DNOMINMAX /DMECMP_DEBUG_KEYS=0 /DMECMP_VERBOSE_DEFAULT=0 /Isrc tests/session_test.cpp src/server/relay.cpp src/core/config.cpp src/core/log.cpp src/net/upnp.cpp src/net/joincode.cpp src/net/protocol.cpp /Fe:session_test.exe /link ws2_32.lib
          if errorlevel 1 exit /b 1
          session_test.exe
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 /DNOMINMAX /DMECMP_DEBUG_KEYS=0 /DMECMP_VERBOSE_DEFAULT=0 /Isrc tests/main_server_config_test.cpp src/core/config.cpp src/core/log.cpp src/net/protocol.cpp /Fe:main_server_config_test.exe /link ws2_32.lib
          if errorlevel 1 exit /b 1
          main_server_config_test.exe

  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Network tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/net_test.cpp src/net/protocol.cpp src/net/joincode.cpp -o net_test
          ./net_test
      - name: Name-tag projection test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/camera_test.cpp -o camera_test
          ./camera_test
      - name: Dedicated server tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/server_test.cpp src/server/relay.cpp src/server/discord.cpp src/net/protocol.cpp -ldl -pthread -o server_test
          ./server_test
      - name: Host send-limit tests (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/host_guard_test.cpp -o host_guard_test
          ./host_guard_test
      - name: Dedicated server build (Linux)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux --target mecmp_server
      - name: Upload the Linux server
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mecmp_server-linux-x64
          path: build-linux/mecmp_server
      - name: Ghost placement test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/pose_test.cpp -o pose_test
          ./pose_test
      - name: Full-body bone set test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/body_set_test.cpp -o body_set_test
          ./body_set_test
      - name: Replay header test (Linux, sanitizers)
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc -fsanitize=address,undefined -fno-sanitize-recover=undefined -g \
            tests/replay_header_test.cpp -o replay_header_test
          ./replay_header_test

  windows-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # a stalled package mirror fails the job instead of holding it for hours
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mingw
      - name: Configure and build (x64, Release)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_BUILD_TYPE=Release \
            -DMECMP_DEBUG_KEYS=OFF
          cmake --build build
      - name: Upload binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mecmp-x64
          path: |
            build/*.dll
            build/*.exe
