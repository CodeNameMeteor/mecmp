name: release

# Two channels, chosen by the tag:
#   v0.9.0         release: Release build, developer keys off, a draft GitHub release (publish it by hand after a last look)
#   v0.9.1-beta.1  beta: Release build with the verbose log on, a draft pre-release
# Neither has the developer keys (F7/F9/F10/F12): players kept pressing them. Those are for local builds only.
# The tag's version must match src/app/mod.h (the part before the first "-"). "Run workflow" by hand builds the
# packages only, in the channel picked there (beta by default), and makes no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build:
        description: "Channel to build: beta (verbose log on) or release"
        type: choice
        options: [beta, release]
        default: beta

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      label: ${{ steps.plan.outputs.label }}
      build_type: ${{ steps.plan.outputs.build_type }}
      debug_keys: ${{ steps.plan.outputs.debug_keys }}
      verbose: ${{ steps.plan.outputs.verbose }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Channel and version
        id: plan
        env:
          BUILD_INPUT: ${{ github.event.inputs.build }}
        run: |
          ver=$(sed -n 's/.*kVersion = "\(.*\)".*/\1/p' src/app/mod.h)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            base="${tag%%-*}" # 0.9.1-beta.1 -> 0.9.1
            if [ "$base" != "$ver" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match the mod's version $ver (src/app/mod.h)"; exit 1
            fi
            label="$tag"
            if [ "$tag" = "$base" ]; then channel=release; else channel=beta; fi
          else
            channel="${BUILD_INPUT:-beta}"
            if [ "$channel" = beta ]; then label="$ver-test.$GITHUB_RUN_NUMBER"; else label="$ver"; fi
          fi
          # Both channels are optimised and have no developer keys. The beta turns the verbose log on.
          build_type=Release
          debug_keys=OFF
          if [ "$channel" = beta ]; then verbose=ON; else verbose=OFF; fi
          {
            echo "channel=$channel"
            echo "label=$label"
            echo "build_type=$build_type"
            echo "debug_keys=$debug_keys"
            echo "verbose=$verbose"
          } >> "$GITHUB_OUTPUT"
          echo "Building $label: $channel (CMAKE_BUILD_TYPE=$build_type, MECMP_DEBUG_KEYS=$debug_keys, MECMP_VERBOSE_LOG=$verbose)"

  windows:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # a stalled package mirror fails the job instead of holding it for hours
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mingw
      - name: zip (for the package)
        run: command -v zip >/dev/null || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends zip
      - name: Build (x64, ${{ needs.plan.outputs.channel }}, developer keys ${{ needs.plan.outputs.debug_keys }})
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix \
            -DCMAKE_BUILD_TYPE=${{ needs.plan.outputs.build_type }} \
            -DMECMP_DEBUG_KEYS=${{ needs.plan.outputs.debug_keys }} \
            -DMECMP_VERBOSE_LOG=${{ needs.plan.outputs.verbose }}
          cmake --build build
      - name: Package
        run: |
          name="MECMP-${{ needs.plan.outputs.label }}-windows"
          mkdir -p "pkg/$name/docs"
          # version.dll is the loader: copied into the game folder, it loads mecmp.dll with the game (no injector).
          cp build/mecmp.dll build/version.dll build/mecmp_inject.exe build/mecmp_server.exe "pkg/$name/"
          test -s "pkg/$name/version.dll" && test -s "pkg/$name/mecmp.dll"
          if [ "${{ needs.plan.outputs.channel }}" = beta ]; then
            {
              echo "BETA BUILD. Verbose logging is on: send mecmp.log with any bug report."
              echo
              cat docs/INSTALL.txt
            } > "pkg/$name/README.txt"
          else
            cp docs/INSTALL.txt "pkg/$name/README.txt"
          fi
          cp LICENSE THIRD_PARTY_NOTICES.md CHANGELOG.md "pkg/$name/"
          cp docs/SERVER.md "pkg/$name/docs/"
          (cd pkg && zip -r "../$name.zip" "$name")
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: MECMP-*-windows.zip

  linux-server:
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the server (${{ needs.plan.outputs.build_type }})
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ needs.plan.outputs.build_type }}
          cmake --build build --target mecmp_server
          strip build/mecmp_server
      - name: Server tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Isrc tests/server_test.cpp src/server/relay.cpp src/server/discord.cpp src/net/protocol.cpp -ldl -pthread -o server_test
          ./server_test
      - name: Package
        run: |
          name="mecmp_server-${{ needs.plan.outputs.label }}-linux-x64"
          mkdir -p "pkg/$name"
          cp build/mecmp_server docs/SERVER.md LICENSE "pkg/$name/"
          tar -C pkg -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-server
          path: mecmp_server-*-linux-x64.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: [plan, windows, linux-server]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the full history: the commits since the previous release or beta
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          base="${ver%%-*}"
          section() { awk -v v="$1" '$0 ~ "^## "v"($|[: ])" {on=1; next} on && /^## / {exit} on' CHANGELOG.md; }
          # This version's section of CHANGELOG.md (from its heading to the next one). A beta without its own
          # section gets the Unreleased one: the changes it is testing.
          section "$ver" > notes.md
          if [ "$CHANNEL" = beta ] && ! grep -q '[^[:space:]]' notes.md; then section "Unreleased" > notes.md; fi
          if [ "$CHANNEL" = beta ]; then
            printf '\nBeta build: optimised, with verbose logging.\n' >> notes.md
          fi
          # Then the commits since the previous tag (all of them for the first release), newest first.
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          {
            echo
            echo "## Commits${prev:+ since $prev}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } >> notes.md
          prerelease=""
          if [ "$CHANNEL" = beta ]; then prerelease="--prerelease"; fi
          case "$base" in 0.*) prerelease="--prerelease" ;; esac
          # If a draft with this tag already exists (made by hand), add the files to it and keep its notes.
          gh release create "$GITHUB_REF_NAME" dist/* --draft $prerelease \
            --title "MECMP $ver" --notes-file notes.md \
            || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
